[project]
name = "powerbi-to-looker"
version = "0.1.0"
description = "Power BI to LookML migration library (semantic layer)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SquareShift" },
]
keywords = ["powerbi", "looker", "lookml", "migration", "bi", "business-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]

dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "requests>=2.28.0",
    "pbixray>=0.5.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "pybix",
    "lark>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.3.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
powerbi_to_looker = ["generator/dashboard_template/*.lookml", "generator/templates/*.j2", "templates/*.j2", "config/*.yaml", "dax/*.lark"]

[tool.pytest.ini_options]
# Only tests/ contains pytest tests. scripts/ is for standalone real runs (e.g. run_collector_real.py).
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
