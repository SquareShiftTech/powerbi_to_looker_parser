# Power BI → canonical mapping (see plan/yaml_rules.md). No Looker/LookML keys here.

data_types:
  String: string
  Int64: number
  Double: number
  DateTime: datetime
  Date: date
  Boolean: boolean

column_types:
  Data: dimension
  Calculated: calculated_field
  calculatedTableColumn: dimension  # columns in calculated tables

# Power BI summarizeBy → canonical aggregation for dimensions (or null)
summarizeBy:
  none: null
  sum: SUM
  default: null

relationship:
  join_type:
    default: LEFT

measure_aggregation:
  # DAX / Power BI → canonical aggregation; default null when not inferrable
  SUM: SUM
  SUMX: SUM
  DISTINCTCOUNT: COUNT
  COUNT: COUNT
  COUNTROWS: COUNT
  AVERAGE: AVG
  AVERAGEX: AVG
  MIN: MIN
  MAX: MAX
  default: null

defaults:
  data_type: string
  join_type: LEFT
  measure_default_aggregation: SUM   # when aggregation cannot be inferred
  measure_data_type: number          # default data_type for measures (formula/numeric)
  dimension_number_aggregation: SUM # default aggregation for numeric dimensions (e.g. Discount, Sales)

# M expression pattern or source type → canonical connection_provider (for datasource type identification)
connection_provider:
  GoogleBigQuery.Database: bigquery
  Sql.Database: sql_server
  Odbc.DataSource: odbc
  AdoDotNet.DataSource: sql_server
  default: unknown
