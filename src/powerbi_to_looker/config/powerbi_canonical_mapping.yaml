# Power BI → canonical mapping (see plan/yaml_rules.md). No Looker/LookML keys here.

data_types:
  # Power BI / API
  String: string
  Int64: number
  Double: number
  DateTime: datetime
  Date: date
  Boolean: boolean
  # Pandas (e.g. from pbixray when using --local)
  object: string
  int64: number
  float64: number
  datetime64[ns]: datetime
  datetime64[ns, UTC]: datetime
  bool: boolean

column_types:
  Data: dimension
  Calculated: calculated_field

relationship:
  join_type:
    default: LEFT

measure_aggregation:
  # DAX / Power BI → canonical aggregation; default null when not inferrable
  SUM: SUM
  SUMX: SUM
  DISTINCTCOUNT: COUNT
  COUNT: COUNT
  COUNTROWS: COUNT
  AVERAGE: AVG
  AVERAGEX: AVG
  MIN: MIN
  MAX: MAX
  default: null

defaults:
  data_type: string
  join_type: LEFT
  measure_default_aggregation: SUM   # when aggregation cannot be inferred
  measure_data_type: number          # default data_type for measures (formula/numeric)
  dimension_number_aggregation: SUM # default aggregation for numeric dimensions (e.g. Discount, Sales)
