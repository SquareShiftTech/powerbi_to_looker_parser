# ============================================================
# function_mapping.yaml
# DAX Function -> BigQuery SQL Equivalent
#
# Three sections:
#   direct_mapping  -> rename or template, args pass through
#   extract_mapping -> becomes EXTRACT(unit FROM col)
#   unsupported     -> cannot auto-convert, flag as manual
#
# Template syntax in direct_mapping:
#   {0}, {1} ... = positional args from DAX function call
#   No braces    = wrap args as FUNC(arg1, arg2, ...)
#   null         = no BQ equivalent, raises ValueError
#
# Functions NOT in yaml but handled in code (_HANDLERS dict):
#   SWITCH, COALESCE, SELECTEDVALUE
#   SUMX, AVERAGEX, MINX, MAXX, COUNTX, COUNTAX
#   COUNTBLANK, DISTINCTCOUNTNOBLANK
#   EOMONTH, DATEDIFF, DATEADD, WEEKDAY
#   FORMAT, TEXT, REPLACE, CONCATENATEX
#   CALCULATE  (partial -- see formula_converter.py)
# ============================================================


# ============================================================
# DIRECT MAPPING
# ============================================================

direct_mapping:

  # --- Aggregation -------------------------------------------
  SUM:              SUM
  MIN:              MIN
  MAX:              MAX
  AVERAGE:          AVG
  COUNT:            "COUNT({0})"
  COUNTA:           "COUNT({0})"
  DISTINCTCOUNT:    "COUNT(DISTINCT {0})"
  MEDIAN:           "APPROX_QUANTILES({0}, 2)[OFFSET(1)]"
  GEOMEAN:          "EXP(AVG(LN({0})))"
  PRODUCT:          "EXP(SUM(LN({0})))"
  COUNTROWS:        "(SELECT COUNT(*) FROM {0})"

  # --- Statistical -------------------------------------------
  STDEV.P:          STDDEV_POP
  STDEV.S:          STDDEV_SAMP
  STDEVX.P:         STDDEV_POP
  STDEVX.S:         STDDEV_SAMP
  VAR.P:            VAR_POP
  VAR.S:            VAR_SAMP
  VARX.P:           VAR_POP
  VARX.S:           VAR_SAMP

  # --- Math --------------------------------------------------
  ABS:              ABS
  SQRT:             SQRT
  EXP:              EXP
  POWER:            "POW({0}, {1})"
  MOD:              "MOD({0}, {1})"
  SIGN:             "SIGN({0})"
  FLOOR:            "FLOOR({0})"
  CEILING:          "CEIL({0})"
  EVEN:             "(2 * CEIL({0} / 2))"
  ODD:              "(2 * FLOOR({0} / 2) + 1)"
  LN:               "LN({0})"
  LOG10:            "LOG10({0})"
  LOG:              "LOG({0}, {1})"
  QUOTIENT:         "DIV({0}, {1})"
  DIVIDE:           "IFNULL(SAFE_DIVIDE({0}, {1}), {2})"
  TRUNC:            "TRUNC({0})"
  INT:              "CAST({0} AS INT64)"
  PI:               "ACOS(-1)"
  DEGREES:          "({0} * 180 / ACOS(-1))"
  RADIANS:          "({0} * ACOS(-1) / 180)"
  SIN:              "SIN({0})"
  COS:              "COS({0})"
  TAN:              "TAN({0})"
  ASIN:             "ASIN({0})"
  ACOS:             "ACOS({0})"
  ATAN:             "ATAN({0})"
  ATAN2:            "ATAN({0}, {1})"
  ROUND:            "ROUND({0}, {1})"
  ROUNDUP:          "CEIL({0} * POW(10, {1})) / POW(10, {1})"
  ROUNDDOWN:        "FLOOR({0} * POW(10, {1})) / POW(10, {1})"
  MROUND:           "ROUND({0} / {1}) * {1}"

  # --- Text --------------------------------------------------
  LEN:              "LENGTH({0})"
  UPPER:            "UPPER({0})"
  LOWER:            "LOWER({0})"
  TRIM:             "TRIM({0})"
  LEFT:             "LEFT({0}, {1})"
  RIGHT:            "RIGHT({0}, {1})"
  MID:              "SUBSTR({0}, {1}, {2})"
  REPT:             "REPEAT({0}, {1})"
  SUBSTITUTE:       "REPLACE({0}, {1}, {2})"
  CONCATENATE:      "CONCAT({0}, {1})"
  EXACT:            "({0} = {1})"
  FIND:             "STRPOS({0}, {1})"
  SEARCH:           "STRPOS(LOWER({0}), LOWER({1}))"
  UNICODE:          "TO_CODE_POINTS({0})[OFFSET(0)]"
  UNICHAR:          "CODE_POINTS_TO_STRING([{0}])"
  CLEAN:            "REGEXP_REPLACE({0}, r'[\\x00-\\x1F]', '')"
  CODE:             "TO_CODE_POINTS({0})[OFFSET(0)]"
  CHAR:             "CODE_POINTS_TO_STRING([{0}])"
  FIXED:            "FORMAT(CONCAT('%.', CAST({1} AS STRING), 'f'), {0})"
  NUMBERVALUE:      "CAST({0} AS FLOAT64)"

  # --- Logical -----------------------------------------------
  IF:               "CASE WHEN {0} THEN {1} ELSE {2} END"
  IFERROR:          "IFNULL({0}, {1})"
  NULLIF:           "NULLIF({0}, {1})"
  AND:              "({0} AND {1})"
  OR:               "({0} OR {1})"
  NOT:              "(NOT {0})"
  TRUE:             "TRUE"
  FALSE:            "FALSE"
  BLANK:            "NULL"

  # --- Information -------------------------------------------
  ISBLANK:          "({0} IS NULL OR CAST({0} AS STRING) = '')"
  ISNULL:           "({0} IS NULL)"
  ISNUMBER:         "({0} IS NOT NULL)"
  ISTEXT:           "({0} IS NOT NULL)"
  ISLOGICAL:        "({0} IS NOT NULL)"
  NONBLANK:         "({0} IS NOT NULL AND CAST({0} AS STRING) != '')"
  HASONEVALUE:      "(COUNT(DISTINCT {0}) = 1)"
  USERNAME:         "SESSION_USER()"
  USERPRINCIPALNAME: "SESSION_USER()"

  # --- Date / Time -------------------------------------------
  DATE:             "DATE({0}, {1}, {2})"
  TIME:             "TIME({0}, {1}, {2})"
  NOW:              "CURRENT_TIMESTAMP()"
  TODAY:            "CURRENT_DATE()"
  EDATE:            "DATE_ADD({0}, INTERVAL {1} MONTH)"

  # --- Conversion --------------------------------------------
  VALUE:            "CAST({0} AS FLOAT64)"
  CURRENCY:         "CAST({0} AS FLOAT64)"
  DATEVALUE:        "DATE({0})"
  TIMEVALUE:        "TIME({0})"


# ============================================================
# EXTRACT MAPPING
# DAX functions -> EXTRACT(unit FROM col) in BigQuery
# ============================================================

extract_mapping:
  YEAR:     YEAR
  MONTH:    MONTH
  DAY:      DAY
  HOUR:     HOUR
  MINUTE:   MINUTE
  SECOND:   SECOND
  QUARTER:  QUARTER
  WEEK:     ISOWEEK
  WEEKNUM:  ISOWEEK


# ============================================================
# OPERATOR MAPPING
# BinOp operators in DAX AST -> BigQuery equivalents
# ============================================================

operator_mapping:
  "&":   "||"
  "<>":  "!="
  "&&":  "AND"
  "||":  "OR"
  "=":   "="
  "<":   "<"
  ">":   ">"
  "<=":  "<="
  ">=":  ">="
  "+":   "+"
  "-":   "-"
  "*":   "*"
  "/":   "/"
  "^":   "POW"


# ============================================================
# UNSUPPORTED
# Cannot auto-convert. Raises ValueError with message.
# ============================================================

unsupported:

  # --- Filter context ----------------------------------------
  - name: CALCULATETABLE
    message: "CALCULATETABLE returns a filtered table — rewrite as subquery or CTE with WHERE clause."

  - name: ALL
    message: "ALL removes all filters — rewrite as window function SUM(...) OVER () for grand total, or remove WHERE clause in subquery."

  - name: ALLEXCEPT
    message: "ALLEXCEPT keeps filters on specified columns only — rewrite as window function with PARTITION BY on the kept columns."

  - name: ALLSELECTED
    message: "ALLSELECTED has no BigQuery equivalent — requires manual query design based on visual filter context."

  - name: ALLNOBLANKROW
    message: "ALLNOBLANKROW — rewrite as ALL equivalent with IS NOT NULL filter added."

  - name: KEEPFILTERS
    message: "KEEPFILTERS is a CALCULATE modifier — rewrite as AND condition in WHERE clause."

  - name: REMOVEFILTERS
    message: "REMOVEFILTERS — rewrite as window function or subquery without WHERE filter."

  - name: USERELATIONSHIP
    message: "USERELATIONSHIP activates an inactive relationship — rewrite as explicit JOIN on alternate key in BigQuery."

  - name: CROSSFILTER
    message: "CROSSFILTER changes relationship direction — requires manual bi-directional JOIN design."

  # --- Row context -------------------------------------------
  - name: EARLIER
    message: "EARLIER references outer row context in nested iteration — rewrite as self-JOIN or window function with PARTITION BY."

  - name: EARLIEST
    message: "EARLIEST — similar to EARLIER. Rewrite as self-JOIN."

  # --- Table functions ---------------------------------------
  - name: FILTER
    message: "FILTER returns a filtered table — rewrite as subquery SELECT ... WHERE ... or CTE."

  # SUMMARIZE is now handled by code handler (_convert_summarize) - removed from unsupported
  # - name: SUMMARIZE
  #   message: "SUMMARIZE produces a virtual grouped table — rewrite as SELECT with GROUP BY in BigQuery or a Looker derived table."

  - name: SUMMARIZECOLUMNS
    message: "SUMMARIZECOLUMNS — rewrite as SELECT with GROUP BY."

  - name: ADDCOLUMNS
    message: "ADDCOLUMNS adds computed columns to a table — rewrite as SELECT with additional expressions."

  - name: SELECTCOLUMNS
    message: "SELECTCOLUMNS projects columns from a table — rewrite as SELECT col1, col2 FROM table."

  - name: CROSSJOIN
    message: "CROSSJOIN — rewrite as CROSS JOIN in BigQuery SQL."

  - name: UNION
    message: "UNION — rewrite as UNION ALL in BigQuery."

  - name: INTERSECT
    message: "INTERSECT — rewrite as INTERSECT DISTINCT in BigQuery."

  - name: EXCEPT
    message: "EXCEPT — rewrite as EXCEPT DISTINCT in BigQuery."

  - name: NATURALLEFTOUTERJOIN
    message: "NATURALLEFTOUTERJOIN — rewrite as LEFT JOIN on matching column names."

  - name: NATURALINNERJOIN
    message: "NATURALINNERJOIN — rewrite as INNER JOIN on matching column names."

  - name: GENERATE
    message: "GENERATE — rewrite as CROSS JOIN with filter condition."

  - name: GENERATEALL
    message: "GENERATEALL — rewrite as CROSS JOIN with filter condition."

  - name: TOPNSKIP
    message: "TOPNSKIP — rewrite as LIMIT n OFFSET k in BigQuery."

  - name: TOPN
    message: "TOPN — rewrite as ORDER BY expr DESC LIMIT n in BigQuery."

  # --- Relationships -----------------------------------------
  - name: RELATED
    message: "RELATED fetches a value from a related table — rewrite as JOIN on the relationship key defined in table_relationships."

  - name: RELATEDTABLE
    message: "RELATEDTABLE returns all related rows — rewrite as subquery or JOIN."

  # --- Time intelligence -------------------------------------
  - name: TOTALYTD
    message: "TOTALYTD — rewrite as: SUM(metric) WHERE date >= DATE_TRUNC(current_date, YEAR) AND date <= current_date"

  - name: TOTALQTD
    message: "TOTALQTD — rewrite as: SUM(metric) WHERE date >= DATE_TRUNC(current_date, QUARTER) AND date <= current_date"

  - name: TOTALMTD
    message: "TOTALMTD — rewrite as: SUM(metric) WHERE date >= DATE_TRUNC(current_date, MONTH) AND date <= current_date"

  - name: SAMEPERIODLASTYEAR
    message: "SAMEPERIODLASTYEAR — rewrite as: WHERE date BETWEEN DATE_ADD(start, INTERVAL -1 YEAR) AND DATE_ADD(end, INTERVAL -1 YEAR)"

  - name: PARALLELPERIOD
    message: "PARALLELPERIOD — rewrite as DATE_ADD/DATE_SUB with appropriate interval for the period shift."

  - name: DATESINPERIOD
    message: "DATESINPERIOD — rewrite as: WHERE date BETWEEN DATE_SUB(anchor, INTERVAL n unit) AND anchor"

  - name: DATESBETWEEN
    message: "DATESBETWEEN — rewrite as: WHERE date BETWEEN start_date AND end_date"

  - name: DATESYTD
    message: "DATESYTD — rewrite as: WHERE date BETWEEN DATE_TRUNC(date, YEAR) AND date"

  - name: DATESQTD
    message: "DATESQTD — rewrite as: WHERE date BETWEEN DATE_TRUNC(date, QUARTER) AND date"

  - name: DATESMTD
    message: "DATESMTD — rewrite as: WHERE date BETWEEN DATE_TRUNC(date, MONTH) AND date"

  - name: FIRSTDATE
    message: "FIRSTDATE — rewrite as: MIN(date)"

  - name: LASTDATE
    message: "LASTDATE — rewrite as: MAX(date)"

  - name: FIRSTNONBLANK
    message: "FIRSTNONBLANK — rewrite as: MIN(CASE WHEN expr IS NOT NULL THEN date END)"

  - name: LASTNONBLANK
    message: "LASTNONBLANK — rewrite as: MAX(CASE WHEN expr IS NOT NULL THEN date END)"

  - name: NEXTDAY
    message: "NEXTDAY — rewrite as: DATE_ADD(date, INTERVAL 1 DAY)"

  - name: NEXTMONTH
    message: "NEXTMONTH — rewrite as: DATE_ADD(date, INTERVAL 1 MONTH)"

  - name: NEXTQUARTER
    message: "NEXTQUARTER — rewrite as: DATE_ADD(date, INTERVAL 1 QUARTER)"

  - name: NEXTYEAR
    message: "NEXTYEAR — rewrite as: DATE_ADD(date, INTERVAL 1 YEAR)"

  - name: PREVIOUSDAY
    message: "PREVIOUSDAY — rewrite as: DATE_SUB(date, INTERVAL 1 DAY)"

  - name: PREVIOUSMONTH
    message: "PREVIOUSMONTH — rewrite as: DATE_SUB(date, INTERVAL 1 MONTH)"

  - name: PREVIOUSQUARTER
    message: "PREVIOUSQUARTER — rewrite as: DATE_SUB(date, INTERVAL 1 QUARTER)"

  - name: PREVIOUSYEAR
    message: "PREVIOUSYEAR — rewrite as: DATE_SUB(date, INTERVAL 1 YEAR)"

  - name: STARTOFMONTH
    message: "STARTOFMONTH — rewrite as: DATE_TRUNC(date, MONTH)"

  - name: STARTOFQUARTER
    message: "STARTOFQUARTER — rewrite as: DATE_TRUNC(date, QUARTER)"

  - name: STARTOFYEAR
    message: "STARTOFYEAR — rewrite as: DATE_TRUNC(date, YEAR)"

  - name: ENDOFMONTH
    message: "ENDOFMONTH — rewrite as: LAST_DAY(date, MONTH)"

  - name: ENDOFQUARTER
    message: "ENDOFQUARTER — rewrite as: LAST_DAY(date, QUARTER)"

  - name: ENDOFYEAR
    message: "ENDOFYEAR — rewrite as: LAST_DAY(date, YEAR)"

  - name: CALENDAR
    message: "CALENDAR — rewrite as: SELECT date FROM UNNEST(GENERATE_DATE_ARRAY(start, end)) AS date"

  - name: CALENDARAUTO
    message: "CALENDARAUTO — rewrite as GENERATE_DATE_ARRAY between MIN and MAX date in the model."

  # --- Ranking -----------------------------------------------
  - name: RANKX
    message: "RANKX — rewrite as RANK() OVER (ORDER BY expr DESC). Verify partition and ordering context."

  # --- Parent-child hierarchy --------------------------------
  - name: PATH
    message: "PATH — hierarchical path function. Requires recursive CTE in BigQuery."

  - name: PATHCONTAINS
    message: "PATHCONTAINS — rewrite using REGEXP_CONTAINS on PATH result."

  - name: PATHITEM
    message: "PATHITEM — rewrite using SPLIT on PATH result and array indexing."

  - name: PATHITEMREVERSE
    message: "PATHITEMREVERSE — rewrite using SPLIT and ARRAY_REVERSE on PATH result."

  - name: PATHLENGTH
    message: "PATHLENGTH — rewrite as ARRAY_LENGTH(SPLIT(path_col, '|'))."

  # --- Advanced / no equivalent ------------------------------
  - name: LOOKUPVALUE
    message: "LOOKUPVALUE — rewrite as: (SELECT result_col FROM table WHERE search_col = value LIMIT 1). Use scalar subquery or JOIN."

  - name: GROUPBY
    message: "GROUPBY — rewrite as SELECT with GROUP BY in BigQuery."

  - name: IGNORE
    message: "IGNORE is a SUMMARIZECOLUMNS modifier — no BigQuery equivalent."

  - name: ROLLUP
    message: "ROLLUP — use ROLLUP() grouping sets in BigQuery."

  - name: ROLLUPADDISSUBTOTAL
    message: "ROLLUPADDISSUBTOTAL — use ROLLUP() grouping sets in BigQuery."

  - name: ISONORAFTER
    message: "ISONORAFTER — rewrite as WHERE clause with composite key comparison."

  - name: CONTAINS
    message: "CONTAINS — rewrite as EXISTS (SELECT 1 FROM table WHERE conditions)."

  - name: CONTAINSROW
    message: "CONTAINSROW — rewrite as EXISTS (SELECT 1 FROM table WHERE conditions)."

  - name: CONTAINSSTRING
    message: "CONTAINSSTRING — rewrite as STRPOS(text, substring) > 0 or text LIKE '%substring%'."

  - name: CONTAINSSTRINGEXACT
    message: "CONTAINSSTRINGEXACT — rewrite as STRPOS(text, substring) > 0 (case-sensitive)."

  - name: ISFILTERED
    message: "ISFILTERED — no BigQuery equivalent. In SQL context always evaluates to TRUE."

  - name: ISCROSSFILTERED
    message: "ISCROSSFILTERED — no BigQuery equivalent."

  - name: ISSUBTOTAL
    message: "ISSUBTOTAL — use GROUPING() function in BigQuery ROLLUP."

  - name: NAMEOF
    message: "NAMEOF returns a column name as a string — no BigQuery equivalent."

  - name: COLUMNSTATISTICS
    message: "COLUMNSTATISTICS is a metadata function — no BigQuery equivalent."

  - name: DETAILROWS
    message: "DETAILROWS is a drill-through function — no BigQuery equivalent."

  - name: EVALUATEANDLOG
    message: "EVALUATEANDLOG is a debugging function — remove from formula before migration."

  - name: TOCSV
    message: "TOCSV is an export function — no BigQuery equivalent."

  - name: TOJSON
    message: "TOJSON — rewrite as TO_JSON_STRING(value) in BigQuery."

  - name: HASONEFILTER
    message: "HASONEFILTER — no BigQuery equivalent. Approximation: COUNT(DISTINCT col) = 1."

  - name: CUSTOMDATA
    message: "CUSTOMDATA — no BigQuery equivalent. This is a Power BI embedded token feature."

  - name: VALUES
    message: "VALUES returns distinct values as a table — rewrite as SELECT DISTINCT col FROM table or use as subquery."

  - name: DISTINCT
    message: "DISTINCT returns distinct rows — rewrite as SELECT DISTINCT col FROM table."

  - name: ROW
    message: "ROW creates a single-row table — rewrite as SELECT expr AS col."

  # --- Financial (no BQ equivalent) -------------------------
  - name: XNPV
    message: "XNPV — no BigQuery equivalent. Requires custom UDF implementation."

  - name: XIRR
    message: "XIRR — no BigQuery equivalent. Requires custom UDF implementation."

  - name: PMT
    message: "PMT — no BigQuery equivalent. Rewrite as: -rate * pv / (1 - POW(1 + rate, -nper))"

  - name: IPMT
    message: "IPMT — no BigQuery equivalent. Requires iterative calculation."

  - name: PPMT
    message: "PPMT — no BigQuery equivalent. Requires iterative calculation."

  - name: NPER
    message: "NPER — no BigQuery equivalent. Requires custom UDF implementation."

  - name: PV
    message: "PV — no BigQuery equivalent. Requires custom UDF implementation."

  - name: FV
    message: "FV — no BigQuery equivalent. Requires custom UDF implementation."

  - name: RATE
    message: "RATE — no BigQuery equivalent. Requires iterative calculation."

  - name: SLN
    message: "SLN — rewrite as: (cost - salvage) / life"

  # --- Network / calendar ------------------------------------
  - name: NETWORKDAYS
    message: "NETWORKDAYS — no direct BigQuery equivalent. Approximate: DATE_DIFF(end, start, DAY) - (number of weekend days). Use a calendar table for accurate results."

  - name: NETWORKDAYS.INTL
    message: "NETWORKDAYS.INTL — no BigQuery equivalent. Use a calendar table."

  # --- Type / error checking ---------------------------------
  - name: ISERROR
    message: "ISERROR — no BigQuery equivalent. Use SAFE.function_name() for functions that may fail, or explicit NULL checks."

  - name: CONVERT
    message: "CONVERT(value, datatype) — rewrite as CAST(value AS target_type). Integer=INT64, Double=FLOAT64, String=STRING, Boolean=BOOL, DateTime=TIMESTAMP, Date=DATE."

  # --- Percentile --------------------------------------------
  - name: PERCENTILE.INC
    message: "PERCENTILE.INC(col, k) — rewrite as APPROX_QUANTILES(col, 100)[OFFSET(CAST(k*100 AS INT64))]"

  - name: PERCENTILE.EXC
    message: "PERCENTILE.EXC(col, k) — rewrite as APPROX_QUANTILES(col, 100)[OFFSET(CAST(k*100 AS INT64))]"

  - name: PERCENTILEX.INC
    message: "PERCENTILEX.INC — rewrite as APPROX_QUANTILES(expr, 100)[OFFSET(CAST(k*100 AS INT64))]"

  - name: PERCENTILEX.EXC
    message: "PERCENTILEX.EXC — rewrite as APPROX_QUANTILES(expr, 100)[OFFSET(CAST(k*100 AS INT64))]"

  # --- Misc --------------------------------------------------
  - name: MEDIANX
    message: "MEDIANX(table, expr) — rewrite as APPROX_QUANTILES(expr, 2)[OFFSET(1)]. Verify table filter context."

  - name: GEOMEANX
    message: "GEOMEANX(table, expr) — rewrite as EXP(AVG(LN(expr))). Verify table filter context."

  - name: PRODUCTX
    message: "PRODUCTX(table, expr) — rewrite as EXP(SUM(LN(expr))). Verify table filter context."

  - name: RANK
    message: "RANK(value, column) — rewrite as RANK() OVER (ORDER BY column). Verify partition context."

  - name: HASONEFILTER
    message: "HASONEFILTER — no BigQuery equivalent. Approximation: COUNT(DISTINCT col) = 1."

  - name: CUSTOMDATA
    message: "CUSTOMDATA — Power BI embedded token feature. No BigQuery equivalent."
